name: gerenciador-tarefas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tarefas
      POSTGRES_PASSWORD: tarefas
      POSTGRES_DB: tarefas
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://tarefas:tarefas@postgres:5432/tarefas
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres

volumes:
  pgdata:
